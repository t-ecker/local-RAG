[project]
name = "local-rag"
version = "0.1.0"
description = "Chat with your own documents, fully local. RAG app with hybrid search, reranking and an eval pipeline, powered by Ollama"
authors = [
    { name = "t-ecker", email = "152566019+t-ecker@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "pystemmer>=3.1.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.64.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.69",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "N"]
